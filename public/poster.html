<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плакат с QR-кодом</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
.p{max-width:640px;width:100%}
.t{font-size:18px;color:#666;margin:0 0 8px}
h1{font-size:44px;line-height:1.15;margin:0 0 24px;font-weight:700}
img{width:min(420px,80vw);height:auto;display:block;margin:0 auto 20px;border:1px solid #ddd;border-radius:12px;padding:8px}
.s{font-size:24px;margin:0}
@media print{body{min-height:auto}}
</style>
</head>
<body>
<div class="p">
  <p class="t">Электронная петиция</p>
  <h1>Подари баллы команде «Полный квиздец»</h1>
  <img src="/qr.svg" alt="QR-код петиции">
  <p class="s">Наведи камеру и подпиши</p>
</div>
</body>
</html>
